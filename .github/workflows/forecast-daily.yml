name: Daily mosquito forecast

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-mosquito-forecast
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The public endpoint may enforce an hourly cooldown. A customer API key
    # avoids that delay; this ceiling still lets the resumable fallback finish.
    timeout-minutes: 240
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
      OPEN_METEO_BASE_URL: ${{ vars.OPEN_METEO_BASE_URL }}
      FORECAST_MODEL_MODE: ${{ vars.FORECAST_MODEL_MODE || 'v3-shadow' }}
    steps:
      - name: Check forecast configuration
        id: config
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Add the DATABASE_URL repository secret to enable forecast publication."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.config.outputs.configured == 'true'
        run: npm ci --omit=dev
      - name: Publish forecast with a resumable retry
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          for attempt in 1 2; do
            if npm run forecast:run; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Daily forecast failed after the resumable retry."
              exit 1
            fi
            echo "::warning::Daily forecast attempt failed; retrying the resumable run in 60 seconds."
            sleep 60
          done
      - if: always() && steps.config.outputs.configured == 'true'
        run: npm run forecast:cleanup
