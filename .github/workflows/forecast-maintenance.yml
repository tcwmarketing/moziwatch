name: Daily forecast maintenance

on:
  schedule:
    # Keep database-wide scans and retention work away from the hourly forecast
    # batch. This starts halfway between forecast runs.
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-forecast-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check forecast configuration
        id: config
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Add the DATABASE_URL repository secret to enable forecast maintenance."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.config.outputs.configured == 'true'
        run: npm ci --omit=dev --legacy-peer-deps
      - name: Refresh forecast priorities
        if: steps.config.outputs.configured == 'true'
        run: npm run forecast:sync-schedules
      - name: Refresh recent-report phrases
        if: steps.config.outputs.configured == 'true'
        run: npm run reports:summarize
      - name: Apply forecast retention
        if: always() && steps.config.outputs.configured == 'true'
        run: npm run forecast:cleanup
